<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>经典核心：圆角接触与翻滚恢复</title>
<style>body{margin:0;background:#123839;color:#edf3da;font:13px system-ui}iframe{display:block;border:0;width:100%;height:calc(100dvh - 170px)}body.portrait iframe{width:390px;margin:auto}nav{display:flex;flex-wrap:wrap;gap:7px;padding:10px}button{padding:8px 12px;border:0;border-radius:6px;background:#e9efce;color:#143e3c}output{display:block;white-space:pre-wrap;padding:0 12px;font-size:12px}</style>
<iframe src="/scripts/classic-v9-game.html" title="经典模式场景"></iframe><nav>
<button id="edge">脚底贴边支撑</button><button id="outside">越过物理半径</button><button id="roof">原低顶下恢复</button><button id="blocked">狭窄低顶探测</button><button id="jump">翻滚打断跳跃</button><button id="roll">连续翻滚</button><button id="normal">原路线开跑</button><button id="pause">暂停／继续</button><button id="portrait">横／竖屏</button></nav><output>等待资源…</output>
<script type="module">
import {SourceRouteGenerator} from '/src/route-generator.js';
const frame=document.querySelector('iframe'),out=document.querySelector('output');let r,route,label='菜单',history=[],failures=[],jobs=[],overlay,fixture,cameraFixture;
const read=async n=>(await fetch('/assets/recovered/'+n)).json();const lib=await read('route-library.json');lib.collisionTags=await read('classic-collision-index.json');const gen=new SourceRouteGenerator(lib,{seed:40});let roof,platform;
for(const id of Object.keys(lib.routes))for(const e of gen.compileChunk(id,{startDistance:100,speed:11}).entities){if(!e.sourceIsTrigger&&e.sourceTag==='HitStationPlatform'&&!platform)platform=e;if(!e.sourceIsTrigger&&e.sourceTag==='HitBarrierRoll'&&!roof)roof=e;}
const later=(fn,ms)=>jobs.push(setTimeout(fn,ms));
function removeOverlay(){if(overlay){r.scene.remove(overlay);overlay.traverse(o=>{o.geometry?.dispose();o.material?.dispose();});overlay=null;}}
function showShape(e){fixture=e;overlay=frame.contentWindow.makeControllerFixture(e);}
function reset(){jobs.forEach(clearTimeout);jobs=[];history=[];removeOverlay();fixture=null;const g=r.game;g.routeGenerator=route;g.headstartOnStart=false;g.reset();g.routeGenerator=null;g.entities=g.entities.filter(e=>e.type==='decoration'&&(e.provenance?.environment||/track/i.test(e.visual?.prefabKey??'')));g.nextSection=1e9;const intro=g.introOptions;g.introOptions=null;g.start();g.introOptions=intro;g.state.distance=80;return g;}
frame.addEventListener('load',()=>frame.contentWindow.addEventListener('error',e=>failures.push(e.message)));
setInterval(()=>{if(!r&&frame.contentWindow.__runner?.ready){r=frame.contentWindow.__runner;route=r.game.routeGenerator;const drain=r.game.drainEvents.bind(r.game);r.game.drainEvents=()=>{const events=drain();history.push(...events.map(e=>e.type));history=history.slice(-25);return events;};}if(!r)return;const g=r.game,s=g.state,p=s.player,a=r.character.getAnimationSnapshot().current,q=g.controllerProbe;if(s.phase==='paused'&&cameraFixture!==s){r.cameraController.reset({characterPosition:[p.x,p.y,s.distance]});cameraFixture=s;}if(overlay){overlay.position.x=fixture.x;overlay.position.z=-(fixture.distance-s.distance);}frame.contentDocument.querySelector('#menu').style.visibility=s.phase==='paused'?'hidden':'';out.textContent=`${label} · ${s.phase} · 动作 ${a.name} · 高度 ${p.y.toFixed(5)} · 物理接地 ${p.grounded} · 压缩 ${p.colliderSqueezed}\n恢复次数 ${g.controllerExpansionCount} · ${q?q.trace.map(t=>`${t.move}:${t.rolling?'滚动':'站立'} ${t.from[1].toFixed(4)}→${t.to[1].toFixed(4)}`).join(' / '):'尚无探测'} · 残留重叠 ${q?.overlaps.length??0}\n事件 ${history.join(' → ')} · 错误 ${[...failures,...r.errors].join('|')||0}\n青色为隔离验证碰撞体；数学接触解算不等同于原 PhysX，狭窄低顶为人工边界案例。`;},40);
function edge(outside){const g=reset(),e=g.addEntity({...platform,x:-platform.width/2-(outside?.21:.1),distance:80});showShape(e);const p=g.state.player;Object.assign(p,{y:e.height+.01,velocityY:-5,grounded:false,motionGrounded:false,isFalling:true});g.events.push({type:'hangtime'});for(let i=0;i<5;i++)g.advance(1/120);g.pause();}
document.querySelector('#edge').onclick=()=>{label='原站台侧沿：中心已越界，圆形脚底仍有支撑';edge(false);};document.querySelector('#outside').onclick=()=>{label='原站台侧沿：超出 .2 物理半径，继续下落';edge(true);};
function lowRoof(tight){const g=reset(),e=g.addEntity(tight?{type:'obstacle',sourceIsTrigger:false,sourceLayer:'Hit',sourceTag:'HitBarrierRoll',x:0,distance:80,width:2,depth:4,bottom:.5,height:2}:{...roof,x:0,distance:80});showShape(e);g.action('roll');g.endRoll('fixture-end');g.pause();}
document.querySelector('#roof').onclick=()=>{label='原低顶尺寸：恢复站立后向下离开重叠';lowRoof(false);};document.querySelector('#blocked').onclick=()=>{label='人工 .5 低顶：上探受阻，恢复站立并记录无法容纳的重叠';lowRoof(true);};
document.querySelector('#jump').onclick=()=>{label='翻滚中起跳：两次探测后继续 Jump';const g=reset();g.action('roll');later(()=>g.action('jump'),180);later(()=>g.pause(),450);};
document.querySelector('#roll').onclick=()=>{label='连续翻滚结束：每次恢复一次，最终继续跑步';const g=reset();for(let i=0;i<25;i++)later(()=>g.action('roll'),i*130);later(()=>g.pause(),4200);};
document.querySelector('#normal').onclick=()=>{jobs.forEach(clearTimeout);jobs=[];history=[];removeOverlay();label='原路线经典模式';r.game.routeGenerator=route;r.game.headstartOnStart=false;r.game.reset();frame.contentDocument.querySelector('#headstart').checked=false;frame.contentDocument.querySelector('#start').click();};document.querySelector('#pause').onclick=()=>r.game.pause();document.querySelector('#portrait').onclick=()=>document.body.classList.toggle('portrait');
</script></html>
