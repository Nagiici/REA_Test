<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>经典模式 · 列车接触回归</title>
<style>body{margin:0;background:#123839;color:#edf3da;font:13px system-ui}iframe{display:block;border:0;width:100%;height:calc(100dvh - 155px)}body.portrait iframe{width:390px;margin:auto}nav{display:flex;flex-wrap:wrap;gap:7px;padding:10px}button{padding:8px 12px;border:0;border-radius:6px;background:#e9efce;color:#143e3c}output{display:block;white-space:pre-wrap;padding:0 12px;font-size:12px}</style>
<iframe src="/scripts/classic-v9-game.html" title="经典模式场景"></iframe><nav>
<button id="front">车头接触前</button><button id="hit">车头接触后</button><button id="side">车身侧面阻挡</button><button id="roof">落到移动列车顶</button><button id="roll">车顶连续翻滚</button><button id="normal">原路线开跑</button><button id="pause">暂停／继续</button><button id="portrait">横／竖屏</button></nav><output>等待资源…</output>
<script type="module">
import {SourceRouteGenerator} from '/src/route-generator.js';
import {trainBodyAt} from '/src/classic-train-body.js';
import {controllerCapsule} from '/src/classic-controller.js';
import {capsuleEntitySeparation} from '/src/classic-contact.js';
const frame=document.querySelector('iframe'),out=document.querySelector('output');let r,route,label='菜单',history=[],jobs=[],overlay,proxy,fixture,cameraFixture,penetrations=0;
const read=async n=>(await fetch('/assets/recovered/'+n)).json();const lib=await read('route-library.json');lib.collisionTags=await read('classic-collision-index.json');lib.modelBindings=await read(lib.modelBindingsFile);const gen=new SourceRouteGenerator(lib,{seed:40});const chunk=gen.compileChunk('routes/default/chunks/normal/default_1_track/routechunk_default_1_track_mid_var_1',{startDistance:100,speed:11,playerDistance:50});proxy=chunk.entities.find(e=>e.movingTrainProxy&&Math.abs(e.distance-153.75)<.01);
const later=(fn,ms)=>jobs.push(setTimeout(fn,ms));
function removeOverlay(){if(overlay){r.scene.remove(overlay);overlay.traverse(o=>{o.geometry?.dispose();o.material?.dispose();});overlay=null;}}
function reset(distance){jobs.forEach(clearTimeout);jobs=[];history=[];penetrations=0;removeOverlay();const g=r.game;g.routeGenerator=route;g.headstartOnStart=false;g.reset();g.routeGenerator=null;g.entities=g.entities.filter(e=>e.type==='decoration'&&(e.provenance?.environment||/track/i.test(e.visual?.prefabKey??'')));g.nextSection=1e9;const intro=g.introOptions;g.introOptions=null;g.start();g.introOptions=intro;g.state.distance=distance;fixture=g.addEntity(structuredClone(proxy));for(const e of chunk.entities.filter(e=>e.visual&&e.motionId===proxy.movingTrainProxy.motionId))g.addEntity({...structuredClone(e),distance:e.movingTrain.initialDistance-(distance-e.movingTrain.referencePlayerDistance)*e.movingTrain.ratio});overlay=frame.contentWindow.makeControllerFixture(trainBodyAt(proxy,distance));return g;}
setInterval(()=>{if(!r&&frame.contentWindow.__runner?.ready){r=frame.contentWindow.__runner;route=r.game.routeGenerator;const drain=r.game.drainEvents.bind(r.game);r.game.drainEvents=()=>{const events=drain();history.push(...events.map(e=>e.type));history=history.slice(-25);return events;};}if(!r)return;const g=r.game,s=g.state,p=s.player;let separation=null;if(overlay){const body=trainBodyAt(fixture,s.distance);overlay.position.x=body.x;overlay.position.z=-(body.distance-s.distance);separation=capsuleEntitySeparation(controllerCapsule([p.x,p.y,s.distance],p.colliderSqueezed),body);if(separation<-.00001)penetrations++;}if(s.phase==='paused'&&cameraFixture!==s){r.cameraController.reset({characterPosition:[p.x,p.y,s.distance]});cameraFixture=s;}frame.contentDocument.querySelector('#menu').style.visibility=s.phase==='paused'?'hidden':'';out.textContent=`${label} · ${s.phase} · 动作 ${r.character.getAnimationSnapshot().current.name}\n路程 ${s.distance.toFixed(4)} · 横向 ${p.x.toFixed(5)} · 脚底 ${p.y.toFixed(5)} · 接地 ${p.grounded} · 物理间距 ${separation?.toFixed(7)??'—'} · 穿入采样 ${penetrations}\n事件 ${history.join(' → ')} · 游戏错误 ${r.errors.join('|')||0}\n青色为还原的移动列车实体；原始压缩代理仍保留供自动驾驶使用。`;},40);
document.querySelector('#front').onclick=()=>{label='旧版已死亡的时刻：现在车头尚未接触';const g=reset(148.9);g.advance(1/120);g.pause();};
document.querySelector('#hit').onclick=()=>{label='继续前行直到触发车头接触';const g=reset(148.9);for(let i=0;i<8&&g.state.phase==='running';i++)g.advance(1/120);};
document.querySelector('#side').onclick=()=>{label='低于车顶的侧面进入：实体阻挡';const g=reset(153.75),p=g.state.player;Object.assign(p,{x:1.1,laneFrom:1.1,lane:1,laneDuration:.2,y:2.65,velocityY:-1,grounded:false,motionGrounded:false});g.contacts.add(fixture.id);for(let i=0;i<12;i++)g.advance(1/120);g.pause();};
document.querySelector('#roof').onclick=()=>{label='由上方落到移动列车顶：支撑不穿模';const g=reset(153.75);Object.assign(g.state.player,{y:3.02,velocityY:-4,grounded:false,motionGrounded:false,isJumping:true});for(let i=0;i<12;i++)g.advance(1/120);g.pause();};
document.querySelector('#roll').onclick=()=>{label='车顶翻滚后恢复站立';const g=reset(150.5);Object.assign(g.state.player,{y:2.92,grounded:true,motionGrounded:true});for(let i=0;i<5;i++)later(()=>g.action('roll'),i*120);later(()=>g.pause(),650);};
document.querySelector('#normal').onclick=()=>{jobs.forEach(clearTimeout);jobs=[];history=[];removeOverlay();label='原路线经典模式';r.game.routeGenerator=route;r.game.headstartOnStart=false;r.game.reset();frame.contentDocument.querySelector('#headstart').checked=false;frame.contentDocument.querySelector('#start').click();};document.querySelector('#pause').onclick=()=>r.game.pause();document.querySelector('#portrait').onclick=()=>document.body.classList.toggle('portrait');
</script></html>
