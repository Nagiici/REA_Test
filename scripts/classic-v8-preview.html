<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>经典模式：接地与动作衔接验证</title>
<style>body{margin:0;background:#123839;color:#edf3da;font:13px system-ui}iframe{display:block;border:0;width:100%;height:calc(100dvh - 160px)}body.portrait iframe{width:390px;margin:auto}nav{display:flex;flex-wrap:wrap;gap:7px;padding:10px}button{padding:8px 12px;border:0;border-radius:6px;background:#e9efce;color:#143e3c}output{display:block;white-space:pre-wrap;padding:0 12px;font-size:12px}</style>
<iframe src="/" title="经典模式场景"></iframe>
<nav><button id="contact">落地通知前一帧</button><button id="landing">推进落地通知</button><button id="platform">原站台顶部支撑</button><button id="edge">走落站台边缘</button><button id="revive">复活跳跃衔接</button><button id="roll">连续翻滚</button><button id="normal">原路线开跑</button><button id="pause">暂停／继续</button><button id="portrait">横／竖屏</button></nav>
<output>等待角色资源…</output><script type="module">
import {SourceRouteGenerator} from '/src/route-generator.js';
const frame=document.querySelector('iframe'),out=document.querySelector('output');let r,route,label='菜单',history=[],failures=[],jobs=[],cameraFixture;
const read=async n=>(await fetch('/assets/recovered/'+n)).json();const lib=await read('route-library.json');lib.collisionTags=await read('classic-collision-index.json');const gen=new SourceRouteGenerator(lib,{seed:40});let platform;
for(const id of Object.keys(lib.routes)){platform=gen.compileChunk(id,{startDistance:100,speed:11}).entities.find(e=>e.type==='obstacle'&&!e.sourceIsTrigger&&e.sourceTag==='HitStationPlatform');if(platform)break;}
const later=(fn,ms)=>jobs.push(setTimeout(fn,ms));
function reset(){jobs.forEach(clearTimeout);jobs=[];history=[];const g=r.game;g.routeGenerator=route;g.headstartOnStart=false;g.reset();g.routeGenerator=null;g.entities=g.entities.filter(e=>e.type==='decoration'&&(e.provenance?.environment||/track/i.test(e.visual?.prefabKey??'')));g.nextSection=1e9;const intro=g.introOptions;g.introOptions=null;g.start();g.introOptions=intro;g.state.distance=80;return g;}
frame.addEventListener('load',()=>frame.contentWindow.addEventListener('error',e=>failures.push(e.message)));
setInterval(()=>{if(!r&&frame.contentWindow.__runner?.ready){r=frame.contentWindow.__runner;route=r.game.routeGenerator;const drain=r.game.drainEvents.bind(r.game);r.game.drainEvents=()=>{const events=drain();history.push(...events.map(e=>e.type));history=history.slice(-30);return events;};}if(!r)return;const s=r.game.state,p=s.player,a=r.character.getAnimationSnapshot().current;if(s.phase==='paused'&&cameraFixture!==s){r.cameraController.reset({characterPosition:[p.x,p.y,s.distance]});cameraFixture=s;}frame.contentDocument.querySelector('#menu').style.visibility=s.phase==='paused'?'hidden':'';out.textContent=`${label} · ${s.phase} · 动作 ${a.name} · 高度 ${p.y.toFixed(4)} · 物理接地 ${p.grounded} · 动作接地 ${p.motionGrounded}\n事件 ${history.join(' → ')} · 错误 ${[...failures,...r.errors].join('|')||0}\n隔离场景验证接地时序；站台使用原始碰撞体，独立放置，不代表手机逐帧复现。`;},40);
document.querySelector('#contact').onclick=()=>{label='隔离场景：已接地，尚未派发落地通知';const g=reset();Object.assign(g.state.player,{y:.01,velocityY:-8,grounded:false,motionGrounded:false,isJumping:true,isFalling:true});g.events.push({type:'hangtime'});g.advance(1/120);g.pause();};
document.querySelector('#landing').onclick=()=>{label='隔离场景：下一步落地通知';const g=r.game;if(g.state.phase==='paused')g.pause();g.advance(1/120);g.pause();};
function support(edge){const g=reset(),e=g.addEntity({...platform,x:0,distance:80});Object.assign(g.state.player,{y:e.height+.01,velocityY:-5,grounded:false,motionGrounded:false,isFalling:true});g.events.push({type:'hangtime'});g.advance(1/120);g.advance(1/120);if(edge){g.state.distance=e.distance+e.depth/2-.05;for(let i=0;i<10;i++)g.advance(1/120);}g.pause();}
document.querySelector('#platform').onclick=()=>{label='隔离场景：原站台碰撞体顶部';support(false);};document.querySelector('#edge').onclick=()=>{label='隔离场景：走落原站台边缘';support(true);};
document.querySelector('#revive').onclick=()=>{label='隔离场景：动作接地仍为真，复活通知强制跳跃';const g=reset();Object.assign(g.state.player,{grounded:false,motionGrounded:true,isJumping:true,velocityY:6});g.events.push({type:'board-revive'});g.pause();};
document.querySelector('#roll').onclick=()=>{label='隔离场景：连续翻滚后恢复跑步';const g=reset();for(let i=0;i<25;i++)later(()=>g.action('roll'),i*130);later(()=>g.pause(),4200);};
document.querySelector('#normal').onclick=()=>{jobs.forEach(clearTimeout);jobs=[];history=[];label='原路线经典模式';r.game.routeGenerator=route;r.game.headstartOnStart=false;r.game.reset();frame.contentDocument.querySelector('#headstart').checked=false;frame.contentDocument.querySelector('#start').click();};
document.querySelector('#pause').onclick=()=>r.game.pause();document.querySelector('#portrait').onclick=()=>document.body.classList.toggle('portrait');
</script></html>
