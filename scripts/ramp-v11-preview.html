<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>斜坡车厢 · 跳跃接触验证</title>
<style>body{margin:0;background:#123839;color:#edf3da;font:13px system-ui}iframe{display:block;border:0;width:100%;height:calc(100dvh - 145px)}body.portrait iframe{width:390px;margin:auto}nav{display:flex;flex-wrap:wrap;gap:7px;padding:10px}button{padding:8px 12px;border:0;border-radius:6px;background:#e9efce;color:#143e3c}output{display:block;white-space:pre-wrap;padding:0 12px;font-size:12px}</style>
<iframe src="/scripts/classic-v9-game.html" title="经典模式场景"></iframe><nav><button id="contact">跳跃碰到斜坡</button><button id="roof">跳跃后到达车顶</button><button id="fast">高速跳跃上坡</button><button id="roll">跳跃接翻滚上坡</button><button id="play">播放完整上车过程</button><button id="pause">暂停／继续</button><button id="portrait">横／竖屏</button></nav><output>等待资源…</output>
<script type="module">
import {SourceRouteGenerator} from '/src/route-generator.js';
import {controllerCapsule} from '/src/classic-controller.js';
import {capsuleEntitySeparation} from '/src/classic-contact.js';
const frame=document.querySelector('iframe'),out=document.querySelector('output');let fixtureId=100000;let r,route,label='菜单',history=[],cameraFixture,ramps=[],minSeparation=Infinity,auto=false,acted=false,rolled=false;
const read=async n=>(await fetch('/assets/recovered/'+n)).json();const lib=await read('route-library.json');lib.collisionTags=await read('classic-collision-index.json');lib.modelBindings=await read(lib.modelBindingsFile);const gen=new SourceRouteGenerator(lib,{seed:40});
function reset(speed=11){auto=false;history=[];minSeparation=Infinity;acted=false;rolled=false;const g=r.game;g.routeGenerator=route;g.headstartOnStart=false;g.reset();g.routeGenerator=null;g.entities=g.entities.filter(e=>e.type==='decoration'&&(e.provenance?.environment||/track/i.test(e.visual?.prefabKey??'')));g.nextSection=1e9;const intro=g.introOptions;g.introOptions=null;g.start();g.introOptions=intro;g.entities.forEach(e=>e.id=fixtureId++);g.nextId=fixtureId;g.state.distance=102;g.state.levelSpeed=speed;g.state.speed=speed;const chunk=new SourceRouteGenerator(lib,{seed:40}).compileChunk('routes/default/chunks/normal/routechunk_default_ramp_1',{startDistance:100,speed});chunk.entities.forEach(e=>g.addEntity(e));fixtureId=g.nextId;ramps=g.entities.filter(e=>e.type==='ramp');return g;}
function input(g,roll=false){if(!acted&&g.state.distance>=104){g.action('jump');acted=true;}if(roll&&!rolled&&g.state.distance>=107){g.action('roll');rolled=true;}}
function sample(g){const p=g.state.player;for(const e of ramps)minSeparation=Math.min(minSeparation,capsuleEntitySeparation(controllerCapsule([p.x,p.y,g.state.distance],p.colliderSqueezed),e));}
function simulate(target,speed=11,roll=false){const g=reset(speed);while(g.state.phase==='running'&&g.state.distance<target){input(g,roll);g.advance(1/120);sample(g);}g.pause();}
setInterval(()=>{if(!r&&frame.contentWindow.__runner?.ready){r=frame.contentWindow.__runner;route=r.game.routeGenerator;const drain=r.game.drainEvents.bind(r.game);r.game.drainEvents=()=>{const events=drain();history.push(...events.map(e=>e.type));history=history.slice(-20);return events;};}if(!r)return;const g=r.game,s=g.state,p=s.player;if(auto&&s.phase==='running'){input(g);sample(g);if(s.distance>=116){g.pause();auto=false;}}if(s.phase==='paused'&&cameraFixture!==s){r.cameraController.reset({characterPosition:[p.x,p.y,s.distance]});cameraFixture=s;}frame.contentDocument.querySelector('#menu').style.visibility=s.phase==='paused'?'hidden':'';out.textContent=`${label} · ${s.phase} · 动作 ${r.character.getAnimationSnapshot().current.name}\n路程 ${s.distance.toFixed(4)} · 脚底 ${p.y.toFixed(5)} · 向上速度 ${p.velocityY.toFixed(5)} · 接地 ${p.grounded} · 最小物理间距 ${Number.isFinite(minSeparation)?minSeparation.toFixed(8):'—'}\n事件 ${history.join(' → ')} · 游戏错误 ${r.errors.join('|')||0}\n使用原版斜坡车厢网格、倾斜盒体、入口胶囊和后接车顶。`;},16);
document.querySelector('#contact').onclick=()=>{label='上升中碰到斜坡：脚底沿表面抬升';simulate(108.2);};
document.querySelector('#roof').onclick=()=>{label='跳向斜坡后抵达相邻车顶';simulate(113);};
document.querySelector('#fast').onclick=()=>{label='22单位速度跳跃进入坡面';simulate(108.5,22);};
document.querySelector('#roll').onclick=()=>{label='跳跃接翻滚，沿坡进入车顶';simulate(113,22,true);};
document.querySelector('#play').onclick=()=>{label='完整跳跃上车过程';reset();auto=true;};document.querySelector('#pause').onclick=()=>r.game.pause();document.querySelector('#portrait').onclick=()=>document.body.classList.toggle('portrait');
</script></html>
