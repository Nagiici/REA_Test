<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>经典模式 · 实体阻挡验证</title>
<style>body{margin:0;background:#123839;color:#edf3da;font:13px system-ui}iframe{display:block;border:0;width:100%;height:calc(100dvh - 145px)}body.portrait iframe{width:390px;margin:auto}nav{display:flex;flex-wrap:wrap;gap:7px;padding:10px}button{padding:8px 12px;border:0;border-radius:6px;background:#e9efce;color:#143e3c}output{display:block;white-space:pre-wrap;padding:0 12px;font-size:12px}</style>
<iframe src="/scripts/classic-v9-game.html" title="经典模式场景"></iframe><nav><button id="corner">车角斜向换道</button><button id="jump">跳鞋擦到车头</button><button id="roll">车头翻滚后落地</button><button id="overhead">跳鞋撞横杆</button><button id="side">斜坡侧面换道</button><button id="normal">原路线试玩</button><button id="pause">暂停／继续</button><button id="portrait">横／竖屏</button></nav><output>等待资源…</output>
<script type="module">
import {SourceRouteGenerator} from '/src/route-generator.js';
import {controllerCapsule} from '/src/classic-controller.js';
import {controllerBodyAt} from '/src/classic-controller-move.js';
import {capsuleEntitySeparation} from '/src/classic-contact.js';
const frame=document.querySelector('iframe'),out=document.querySelector('output');let r,route,label='菜单',history=[],cameraFixture,fixtureId=200000,minSeparation=Infinity,simulated=false;
const read=async n=>(await fetch('/assets/recovered/'+n)).json();const lib=await read('route-library.json');lib.collisionTags=await read('classic-collision-index.json');lib.modelBindings=await read(lib.modelBindingsFile);
function reset(routeId,speed){history=[];minSeparation=Infinity;simulated=true;const g=r.game;g.routeGenerator=route;g.headstartOnStart=false;g.reset();g.routeGenerator=null;g.entities=g.entities.filter(e=>e.type==='decoration'&&(e.provenance?.environment||/track/i.test(e.visual?.prefabKey??'')));g.entities.forEach(e=>e.id=fixtureId++);g.nextId=fixtureId;g.nextSection=1e9;const intro=g.introOptions;g.introOptions=null;g.start();g.introOptions=intro;g.state.distance=102;g.state.levelSpeed=speed;g.state.speed=speed;const chunk=new SourceRouteGenerator(lib,{seed:40}).compileChunk(routeId,{startDistance:100,speed});chunk.entities.forEach(e=>g.addEntity(e));fixtureId=g.nextId;return g;}
const train='routes/default/chunks/easy/routechunk_default_train_tops_1',ramp='routes/default/chunks/normal/routechunk_default_ramp_1',bar='routes/default/chunks/hard/routechunk_4_units_3_tracks_b-s-b';
function sample(g){const p=g.state.player,pos=[p.x,p.y,g.state.distance];for(const e of g.entities.filter(e=>e.sourceIsTrigger===false&&e.sourceTag!=='Ground'&&e.sourceShape))minSeparation=Math.min(minSeparation,capsuleEntitySeparation(controllerCapsule(pos,p.colliderSqueezed),controllerBodyAt(e,pos)));}
function simulate(routeId,speed,actions,frames,shoes=false,side=false){const g=reset(routeId,speed);if(shoes)g.activatePowerup('sneakers');if(side){g.state.distance=105;Object.assign(g.state.player,{x:2,lane:2,laneFrom:2,laneDuration:0,laneElapsed:0});}for(let i=0;i<frames&&g.state.phase==='running';i++){if(actions[i])g.action(actions[i]);g.advance(1/120);sample(g);}if(g.state.phase==='running')g.pause();}
setInterval(()=>{if(!r&&frame.contentWindow.__runner?.ready){r=frame.contentWindow.__runner;route=r.game.routeGenerator;const drain=r.game.drainEvents.bind(r.game);r.game.drainEvents=()=>{const events=drain();history.push(...events.map(e=>e.type));history=history.slice(-20);return events;};}if(!r)return;const g=r.game,s=g.state,p=s.player;if(s.phase==='paused'&&cameraFixture!==s){r.cameraController.reset({characterPosition:[p.x,p.y,s.distance]});cameraFixture=s;}frame.contentDocument.querySelector('#menu').style.visibility=s.phase==='paused'?'hidden':'';out.textContent=`${label} · ${s.phase} · 动作 ${r.character.getAnimationSnapshot().current.name}\n路程 ${s.distance.toFixed(5)} · 横向 ${p.x.toFixed(5)} · 脚底 ${p.y.toFixed(5)} · 接地 ${p.grounded} · 最小实体间距 ${Number.isFinite(minSeparation)?minSeparation.toFixed(8):'—'}\n实体接触 ${g.controllerMove?.contacts.length??0} · 残留穿透 ${g.controllerMove?.overlaps.length??0} · 事件 ${history.join(' → ')} · 游戏错误 ${r.errors.join('|')||0}\n真实路线、完整碰撞标签；检查前进、换道、跳跃和反弹后的实际胶囊位置。`;},40);
document.querySelector('#corner').onclick=()=>{label='斜向擦车角，胶囊沿实体滑动';simulate(train,22,{15:'right'},24);};
document.querySelector('#jump').onclick=()=>{label='跳鞋擦到车头：继续向上但不能进入车体';simulate(train,11,{30:'jump'},49,true);};
document.querySelector('#roll').onclick=()=>{label='低位轻碰后翻滚正面受阻：一次致命撞击，避免原地跑';simulate(train,11,{30:'jump',45:'roll'},90,true);};
document.querySelector('#overhead').onclick=()=>{label='跳鞋向上接触横杆：实体阻挡头顶';simulate(bar,22,{0:'jump',15:'roll',30:'jump'},36,true);};
document.querySelector('#side').onclick=()=>{label='入口胶囊也参与侧面阻挡';simulate(ramp,11,{0:'left'},15,false,true);};
document.querySelector('#normal').onclick=()=>{simulated=false;history=[];label='原路线试玩';r.game.routeGenerator=route;r.game.headstartOnStart=false;r.game.reset();r.game.entities.forEach(e=>e.id=fixtureId++);r.game.nextId=fixtureId;frame.contentDocument.querySelector('#headstart').checked=false;frame.contentDocument.querySelector('#start').click();};
document.querySelector('#pause').onclick=()=>r.game.pause();document.querySelector('#portrait').onclick=()=>document.body.classList.toggle('portrait');
</script></html>
